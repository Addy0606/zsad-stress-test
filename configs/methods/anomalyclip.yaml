# AnomalyCLIP (Zhou et al., ICLR 2024): CLIP-based family
name: anomalyclip
class: AnomalyCLIP
protocol: "cross-dataset: prompts trained on VisA for target MVTec AD, trained on MVTec AD for every other target"
params:
  image_size: 518
  sigma: 4.0
  # Official test.sh (which produced the paper's numbers) uses layer 24 only; the test.py default [6, 12, 18, 24]
  # under-reproduces the paper's pixel metrics (checked in our reproduction runs). Image scores don't depend on this.
  features_list: [24]
  clip_cache: ${oc.env:CLIP_CACHE,null}
# Which prompt checkpoint to use for each target dataset ("default" = any other target).
# Pairing taken from the official test.sh: the folder WITHOUT "_visa" is used to test MVTec (so it was
# trained on VisA), the "_visa" folder is used to test VisA (trained on MVTec). Confirmed by reproduction.
checkpoint_by_target:
  mvtec: third_party/AnomalyCLIP/checkpoints/9_12_4_multiscale/epoch_15.pth
  default: third_party/AnomalyCLIP/checkpoints/9_12_4_multiscale_visa/epoch_15.pth
