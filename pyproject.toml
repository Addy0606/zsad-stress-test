[project]
name = "zsad-stress-test"
version = "0.1.0"
description = "Benchmark of zero-shot anomaly detector families across industrial and medical images"
requires-python = ">=3.10"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["third_party", "outputs", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
